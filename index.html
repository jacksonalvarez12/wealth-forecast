<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wealth Forecast</title>
    <script>
      // Apply saved theme before first paint to avoid a flash (dark by default)
      (function () {
        var match = document.cookie.match(/(?:^|;\s*)theme=(light|dark)/);
        document.documentElement.dataset.theme = match ? match[1] : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
